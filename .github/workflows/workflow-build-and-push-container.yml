name: build-image
on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
        default: ghcr.io/${{ github.repository_owner }}
      image-name:
        required: true
        type: string
      context:
        required: false
        type: string
        default: .
      containerfile:
        required: false
        type: string
        default: ./deploy/Containerfile
      tags:
        required: true
        type: string

jobs:
  build-and-push-container:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Buildah build
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ github.event.repository.name }}
          tags: "${{ inputs.tags }}"
          containerfiles: |
            ${{ inputs.containerfile }}
      - name: Push To ghcr.io
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2
        with:
          registry: ${{ inputs.registry }}
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
